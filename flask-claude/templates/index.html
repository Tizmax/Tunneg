
{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-4xl font-bold mb-6 text-center">LE GRAND TUNNEG</h1>
    <h2 class="text-2xl mb-4">Menu principal</h2>

    <form action="{{ url_for('add_player') }}" method="post" class="flex gap-4 mb-6">
        <input type="text" name="player_name" class="flex-grow p-2 border rounded" placeholder="Nom du joueur">
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            Ajouter Joueur
        </button>
    </form>

    {% if players %}
    <div class="mb-6">
        <h2 class="text-2xl mb-2">Joueurs</h2>
        <div class="space-y-2">
            {% for player in players %}
            <div class="flex items-center justify-between p-3 bg-white rounded-lg shadow hover:shadow-md transition">
                <span class="text-lg">{{ player.name }}</span>
                <form action="{{ url_for('remove_player') }}" method="post" class="inline">
                    <button type="submit" class="text-red-500 hover:text-red-700 p-2 rounded-full hover:bg-red-50 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    {% if players|length >= 2 %}
    <form action="{{ url_for('init_game') }}" method="post">
        <button type="submit" class="w-full bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Lancer la partie
        </button>
    </form>
    {% else %}
    <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-700 p-4">
        Ajoutez au moins 2 joueurs pour lancer la partie
    </div>
    {% endif %}
</div>
{% endblock %}
